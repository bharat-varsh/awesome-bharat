<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>AI chatbots</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=DM+Sans:wght@400;500;600&amp;display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw==" crossorigin="anonymous">
	<script src="https://cdn.tailwindcss.com"></script>
	<link rel="stylesheet" href="./assets/css/styles.css">
	<script src="./assets/js/app.js" defer></script>
</head>

<body>

	<!-- Floating particles for atmosphere -->
	<div id="particles" aria-hidden="true"></div>

	<main class="relative z-10 max-w-5xl mx-auto px-5 py-12 sm:py-16">

		<!-- Header -->
		<header>
			<h1 class="text-3xl sm:text-4xl font-bold tracking-tight mb-2"
				style="font-family:'Space Grotesk',sans-serif; letter-spacing:-0.03em;">
				AI chatbots
			</h1>
			<p class="text-sm mb-8" style="color:var(--fg-muted); max-width:480px;">
				Only those LLMs which have a live interface and are free to use are included.
			</p>

			<div class="flex flex-col sm:flex-row sm:items-center gap-5 sm:gap-8">
				<!-- Search + Filter wrapper -->
				<div class="flex flex-col sm:flex-row sm:items-center gap-3" style="max-width: 480px; width: 100%;">
					<!-- Search -->
					<div class="search-wrap" style="flex: 1;">
						<input type="text" id="searchInput" placeholder="Search chatbots..."
							aria-label="Search chatbots">
						<i class="fas fa-search"></i>
					</div>
					<!-- Filter button -->
					<button class="filter-btn" id="filterBtn" aria-label="Toggle filters" aria-controls="filterPanel" aria-expanded="false" title="Toggle filters" type="button">
						<i class="fas fa-filter"></i>
					</button>
				</div>
				<!-- Stats -->
				<div class="stats-bar" id="statsBar" aria-live="polite">
				</div>
			</div>

			<!-- Filter panel -->
			<div class="filter-panel" id="filterPanel" hidden>
				<label class="filter-label" for="noLoginFilter">
					<input type="checkbox" id="noLoginFilter">
					<span>No login needed</span>
				</label>
			</div>
		</header>

		<!-- Groups container -->
		<div id="groupsContainer">
		</div>

		<!-- No results message -->
		<div class="no-results" id="noResults">
			<i class="fas fa-robot"></i>
			<p>No chatbots match your search.</p>
		</div>

	</main>
</body>
</html>
